name: Importar projeto empacotado

on:
  push:
    paths:
      - ".project_archive/**"
      - ".github/workflows/sync-project.yml"

permissions:
  contents: write

jobs:
  extrair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir projeto
        shell: bash
        run: |
          cat .project_archive/part*.b64 > /tmp/restaurante.zip.b64
          base64 -d /tmp/restaurante.zip.b64 > /tmp/restaurante.zip
          rm -rf /tmp/restaurante-src
          mkdir -p /tmp/restaurante-src
          unzip -q /tmp/restaurante.zip -d /tmp/restaurante-src
          rsync -a /tmp/restaurante-src/ ./
          rm -rf .project_archive

      - name: Versionar fontes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: importar versão compatível com a planilha nova"
          git push
